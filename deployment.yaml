apiVersion: v1
kind: ConfigMap
metadata:
  name: journal-db-init
data:
  database_setup.sql: |
    CREATE TABLE IF NOT EXISTS entries (
        id VARCHAR PRIMARY KEY,
        data JSONB NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL,
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_entries_created_at ON entries(created_at);
    CREATE INDEX IF NOT EXISTS idx_entries_data_gin ON entries USING GIN (data);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: journal-db-secret
                  key: password
            - name: POSTGRES_DB
              value: career_journal
          volumeMounts:
          - name: init
            mountPath: /docker-entrypoint-initdb.d
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
      volumes:
      - name: init
        configMap:
          name: journal-db-init
      - name: postgres-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journal-api
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      containers:
        - name: journal-api
          image: 734702670862.dkr.ecr.eu-north-1.amazonaws.com/journal-api:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 8000
          startupProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
              httpGet:
                path: /openapi.json
                port: 8000
              periodSeconds: 10
              failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: journal-db-secret
                  key: database-url
            - name: OPENAI_API_KEY
              value: placeholder
            - name: OPENAI_BASE_URL
              value: https://api.openai.com/v1
            - name: OPENAI_MODEL
              value: gpt-4o-mini
            - name: COMMIT_SHA
              value: unknown
---
apiVersion: v1
kind: Service
metadata:
  name: journal-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: journal-api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
